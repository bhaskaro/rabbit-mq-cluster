global:
  scrape_interval: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - rabbitmq1:15692
          - rabbitmq2:15692
          - rabbitmq3:15692
          - rabbitmq4:15692
