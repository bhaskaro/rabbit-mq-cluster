services:

  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: rabbitmq1
    user: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE123
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    command: >
      bash -ec '
        rabbitmq-plugins enable --offline rabbitmq_prometheus;
        exec rabbitmq-server
      '
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"   # Prometheus
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 10
    networks:
      - rabbitmq-net

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: rabbitmq2
    user: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE123
      RABBITMQ_NODENAME: rabbit@rabbitmq2
    command: >
      bash -ec '
        rabbitmq-plugins enable --offline rabbitmq_prometheus;
        rabbitmq-server &
        pid="$${!}";
        until rabbitmq-diagnostics -q ping; do sleep 2; done;
        if ! rabbitmqctl cluster_status | grep -q "rabbit@rabbitmq1"; then
          rabbitmqctl stop_app;
          rabbitmqctl reset;
          rabbitmqctl -n rabbit@rabbitmq1 forget_cluster_node rabbit@rabbitmq2 || true;
          rabbitmqctl join_cluster rabbit@rabbitmq1;
          rabbitmqctl start_app;
        fi;
        wait "$${pid}"
      '
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5673:5672"
      - "15673:15672"
      - "15693:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "cluster_status"]
      interval: 10s
      retries: 15
    networks:
      - rabbitmq-net

  rabbitmq3:
    image: rabbitmq:3.13-management
    hostname: rabbitmq3
    container_name: rabbitmq3
    user: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE123
      RABBITMQ_NODENAME: rabbit@rabbitmq3
    command: >
      bash -ec '
        rabbitmq-plugins enable --offline rabbitmq_prometheus;
        rabbitmq-server &
        pid="$${!}";
        until rabbitmq-diagnostics -q ping; do sleep 2; done;
        if ! rabbitmqctl cluster_status | grep -q "rabbit@rabbitmq1"; then
          rabbitmqctl stop_app;
          rabbitmqctl reset;
          rabbitmqctl -n rabbit@rabbitmq1 forget_cluster_node rabbit@rabbitmq3 || true;
          rabbitmqctl join_cluster rabbit@rabbitmq1;
          rabbitmqctl start_app;
        fi;
        wait "$${pid}"
      '
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5674:5672"
      - "15674:15672"
      - "15694:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "cluster_status"]
      interval: 10s
      retries: 15
    networks:
      - rabbitmq-net

  rabbitmq4:
    image: rabbitmq:3.13-management
    hostname: rabbitmq4
    container_name: rabbitmq4
    user: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_ERLANG_COOKIE: SUPERSECRETCOOKIE123
      RABBITMQ_NODENAME: rabbit@rabbitmq4
    command: >
      bash -ec '
        rabbitmq-plugins enable --offline rabbitmq_prometheus;
        rabbitmq-server &
        pid="$${!}";
        until rabbitmq-diagnostics -q ping; do sleep 2; done;
        if ! rabbitmqctl cluster_status | grep -q "rabbit@rabbitmq1"; then
          rabbitmqctl stop_app;
          rabbitmqctl reset;
          rabbitmqctl -n rabbit@rabbitmq1 forget_cluster_node rabbit@rabbitmq4 || true;
          rabbitmqctl join_cluster rabbit@rabbitmq1;
          rabbitmqctl start_app;
        fi;
        wait "$${pid}"
      '
    volumes:
      - rabbitmq4_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq1:
        condition: service_healthy
    ports:
      - "5675:5672"
      - "15675:15672"
      - "15695:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "cluster_status"]
      interval: 10s
      retries: 15
    networks:
      - rabbitmq-net


  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - rabbitmq-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - rabbitmq-net

networks:
  rabbitmq-net:
    driver: bridge

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  rabbitmq3_data:
  rabbitmq4_data:
